<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal & Target Belajar IPS</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --table-header-bg: #eef2ff;
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --border-color: #374151;
            --table-header-bg: #312e81;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        header p {
            color: #9ca3af;
        }
        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .theme-toggle:hover {
            background-color: var(--primary-hover);
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        /* Tab Navigasi Hari */
        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .day-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .day-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        /* Progress Bar */
        .progress-container {
            background-color: var(--border-color);
            border-radius: 9999px;
            height: 12px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-top: 5px;
            text-align: right;
        }
        /* Tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--table-header-bg);
            color: var(--primary-color);
        }
        /* Form Tambah Target */
        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .task-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
        }
        .task-form button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .task-form button:hover {
            background-color: var(--primary-hover);
        }
        /* List Target */
        ul.task-list {
            padding-left: 0;
            list-style: none;
        }
        ul.task-list li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .task-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }
        /* Catatan Harian */
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙 Mode Gelap</button>
            <h1>Jadwal & Target Belajar Kelas IPS</h1>
            <p>Pantau jadwal harian, selesaikan target, dan catat PR pentingmu.</p>
        </header>

        <!-- Indikator Progres -->
        <div class="card">
            <h2>📊 Progres Belajar Minggu Ini</h2>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0 dari 0 target selesai (0%)</div>
        </div>

        <!-- Jadwal Harian Interaktif (Tab) -->
        <div class="card">
            <h2>📅 Jadwal Pelajaran Berdasarkan Hari</h2>
            <div class="day-tabs">
                <button class="day-btn active" onclick="switchDay('senin')">Senin</button>
                <button class="day-btn" onclick="switchDay('selasa')">Selasa</button>
                <button class="day-btn" onclick="switchDay('rabu')">Rabu</button>
                <button class="day-btn" onclick="switchDay('kamis')">Kamis</button>
                <button class="day-btn" onclick="switchDay('jumat')">Jumat</button>
            </div>
            <div id="scheduleContent">
                <!-- Konten jadwal harian akan tampil di sini -->
            </div>
        </div>

        <!-- Target Belajar Dinamis -->
        <div class="card">
            <h2>🎯 Target Belajar Harian</h2>
            <div class="task-form">
                <input type="text" id="taskInput" placeholder="Tambah target baru (cth: Rangkum Bab Sosiologi)...">
                <button onclick="addTask()">Tambah</button>
            </div>
            <ul class="task-list" id="taskList">
                <!-- Target akan muncul otomatis di sini -->
            </ul>
        </div>

        <!-- Catatan Penting / PR -->
        <div class="card">
            <h2>📝 Catatan Penting & PR</h2>
            <textarea id="notesInput" placeholder="Tulis PR, tugas kelompok, atau catatan penting di sini... (otomatis tersimpan)" oninput="saveNotes()"></textarea>
        </div>
    </div>

    <script>
        // Data Jadwal Harian Kelas IPS
        const weeklySchedule = {
            senin: [
                { no: 1, mapel: "Pendidikan Agama Islam (PAI)", fokus: "Norma & Keagamaan" },
                { no: 2, mapel: "Bahasa Indonesia", fokus: "Literasi & Kebahasaan" },
                { no: 3, mapel: "Sejarah", fokus: "Kronologi & Peristiwa" }
            ],
            selasa: [
                { no: 1, mapel: "Matematika (Wajib)", fokus: "Logika & Hitungan Dasar" },
                { no: 2, mapel: "Ekonomi", fokus: "Pasar & Keuangan" },
                { no: 3, mapel: "Sosiologi", fokus: "Interaksi & Gejala Sosial" }
            ],
            rabu: [
                { no: 1, mapel: "Geografi", fokus: "Spasial & Fenomena Alam" },
                { no: 2, mapel: "Bahasa Inggris (Wajib)", fokus: "Grammar & Reading" },
                { no: 3, mapel: "TIK", fokus: "Teknologi & Komputer" }
            ],
            kamis: [
                { no: 1, mapel: "Bahasa Inggris (Lanjut)", fokus: "Advanced Communication" },
                { no: 2, mapel: "PKWU", fokus: "Kewirausahaan & Kreativitas" },
                { no: 3, mapel: "Bahasa Arab", fokus: "Kaidah & Kosakata" }
            ],
            jumat: [
                { no: 1, mapel: "PJOK / Taekwondo", fokus: "Kebugaran & Olahraga" },
                { no: 2, mapel: "Bimbingan Konseling (BK)", fokus: "Pengembangan Diri" }
            ]
        };

        function switchDay(day) {
            // Update tombol aktif
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Render tabel sesuai hari
            const schedule = weeklySchedule[day];
            const container = document.getElementById('scheduleContent');
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Mata Pelajaran</th>
                            <th>Fokus / Kategori</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            schedule.forEach(item => {
                html += `
                    <tr>
                        <td>${item.no}</td>
                        <td><strong>${item.mapel}</strong></td>
                        <td>${item.fokus}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Data Awal Target Belajar
        let tasks = [
            { id: 1, text: "Membuat ringkasan materi Sosiologi dan Geografi.", completed: false },
            { id: 2, text: "Mengerjakan latihan soal Ekonomi dan Matematika.", completed: false },
            { id: 3, text: "Latihan bahasa Inggris lanjut dan Bahasa Arab.", completed: false }
        ];

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';

            let completedCount = 0;

            tasks.forEach((task, index) => {
                if (task.completed) completedCount++;

                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="task-item-left">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${index})">
                        <span class="${task.completed ? 'completed' : ''}">${task.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})">Hapus</button>
                `;
                listEl.appendChild(li);
            });

            const total = tasks.length;
            const percentage = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').innerText = `${completedCount} dari ${total} target selesai (${percentage}%)`;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (text === '') return;

            tasks.push({ id: Date.now(), text: text, completed: false });
            input.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function saveNotes() {
            const notes = document.getElementById('notesInput').value;
            localStorage.setItem('user_notes', notes);
        }

        // Dark Mode Logic
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Mode Gelap';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Mode Terang';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.onload = function() {
            // Tampilkan jadwal hari Senin secara *default* saat pertama buka
            switchDayInitial('senin');
            renderTasks();

            const savedNotes = localStorage.getItem('user_notes');
            if (savedNotes) {
                document.getElementById('notesInput').value = savedNotes;
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').innerText = '☀️ Mode Terang';
            }
        };

        function switchDayInitial(day) {
            const schedule = weeklySchedule[day];
            const container = document.getElementById('scheduleContent');
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Mata Pelajaran</th>
                            <th>Fokus / Kategori</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            schedule.forEach(item => {
                html += `
                    <tr>
                        <td>${item.no}</td>
                        <td><strong>${item.mapel}</strong></td>
                        <td>${item.fokus}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    </script>

</body>
</html>
